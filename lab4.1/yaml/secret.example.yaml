# Fichier modèle : de fausses valeurs uniquement.
# Le vrai secret est créé en ligne de commande :
#   kubectl create secret generic db-credentials \
#     --from-literal=DB_USER=appuser \
#     --from-literal=DB_PASSWORD='ChangeMe-123'
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  DB_USER: exemple-utilisateur
  DB_PASSWORD: exemple-mot-de-passe
